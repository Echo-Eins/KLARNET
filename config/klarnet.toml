# config/klarnet.toml

[app]
assistant_name = "Кларнет"
language = "ru"
mode = "gpu"
pre_roll_ms = 1000
max_utterance_s = 120
log_level = "info"

[audio]
sample_rate = 16000
channels = 1
bits_per_sample = 16
buffer_size = 1024
input_device = "default"
output_device = "default"

[vad]
mode = "energy"
frame_duration_ms = 30
energy_threshold = 0.01
initial_noise_floor = 0.001
noise_update_rate = 0.05
min_speech_duration_ms = 200
min_silence_duration_ms = 500
hysteresis_ratio = 0.2
speech_pad_ms = 300

[stt]
language = "ru"
request_timeout_ms = 30000
initialization_timeout_ms = 120000
retry_attempts = 2
retry_backoff_ms = 500

[stt.model]
model_path = "models/faster-whisper-medium"
device = "cuda"
compute_type = "int8_float16"
cache_dir = "cache/whisper"

[stt.backend]
type = "python"
executable = "python3"
script = "scripts/whisper_server.py"

[nlu]
mode = "hybrid"  # local | llm | hybrid
wake_words = ["Кларнет", "ассистент", "компьютер"]
confidence_threshold = 0.7

[nlu.local]
intents_path = "config/patterns.yaml"
entities_path = "config/entities.yaml"

[nlu.llm]
provider = "openrouter"
model = "x-ai/grok-4-fast:free"
api_key = "" # Укажите ключ напрямую или оставьте пустым, чтобы использовать переменную окружения
api_key_env = "OPENROUTER_API_KEY"
max_tokens = 500
temperature = 0.3
top_p = 0.95
timeout_s = 5
retry_attempts = 3
cache_enabled = true
cache_ttl_s = 3600
max_concurrent_requests = 1
min_request_interval_ms = 0

[actions]
enabled_modules = ["system", "smart_home", "web"]
scripts_dir = "scripts/actions"

[actions.smart_home]
api_url = "http://homeassistant.local:8123"
api_token_env = "HASS_TOKEN"
timeout_s = 5

[actions.security]
allow_system_commands = true
require_confirmation = ["shutdown", "restart"]
blocked_commands = []

[tts]
enabled = true
engine = "silero"  # silero | vits | piper
# Задайте язык Silero TTS и модель. Для моделей v4 укажите имя (например, "v4_ru"),
# чтобы загрузить её через torch.hub. Для локальных архивов используйте путь к .pt файлу.
language = "ru"
model = "v4_ru"  # либо путь вида "models/silero/v3_ru.pt"
speaker = "xenia"
sample_rate = 48000
speed = 1.0
device = "cpu"

[tts.cache]
enabled = true
directory = "cache/tts"
max_entries = 128

[tts.monitoring]
enabled = true
min_rms = 0.01
max_latency_ms = 5000

[tts.runtime]
python_path = "python3"
silero_script = "scripts/silero_tts.py"
piper_binary = "piper"
request_timeout_ms = 15000

[api]
enabled = true
host = "0.0.0.0"
port = 3000
cors_origins = ["*"]
grpc_enabled = true
grpc_port = 50051

[metrics]
enabled = true
prometheus_port = 9090
export_interval_s = 10

[observability]
metrics_enabled = true
traces_enabled = true
prometheus_port = 9090
export_interval_s = 10
service_name = "klarnet"
traces_endpoint = "http://localhost:4317"