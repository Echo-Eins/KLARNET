[app]
assistant_name = "Кларнет"
language = "ru"
mode = "cpu"
pre_roll_ms = 1000
max_utterance_s = 120
log_level = "info"

[audio]
sample_rate = 16000
channels = 1
bits_per_sample = 16
# Начинаем консервативно
buffer_size = 2048  # 128ms

# Если в логах видите overflow - увеличьте до:
# buffer_size = 4096  # 256ms

# Если overflow даже с 4096 - ТОЧНО проблема не в буфере!
# Смотрите на:
# - Драйверы микрофона
# - Фоновые процессы
# - Антивирус блокирует доступ?

input_device = "Набор микрофонов (Технология Intel® Smart Sound для цифровых микрофонов)"
output_device = "Колонки (Realtek(R) Audio)"

[wake_word]
enabled = true
keyword = "Кларнет"
sensitivity = 0.7
access_key = ""

[acknowledgment]
enabled = true
phrases = [
    "Слушаю",
    "Да",
    "Готов",
    "Я вас слушаю",
    "Готова к работе",
    "Какая команда?",
    "Внимательно слушаю",
    "Чем могу помочь?",
]
history_size = 5
recovery_rate = 0.3
min_weight = 0.1
cache_enabled = true

[vad]
mode = "energy"
frame_duration_ms = 30
energy_threshold = 0.05
initial_noise_floor = 0.001
noise_update_rate = 0.05
min_speech_duration_ms = 150
min_silence_duration_ms = 400
hysteresis_ratio = 0.2
speech_pad_ms = 300

[stt]
language = "ru"
request_timeout_ms = 30000
initialization_timeout_ms = 120000
retry_attempts = 2
retry_backoff_ms = 500

[stt.model]
model_path = "models/whisper-medium"
device = "cpu"
compute_type = "int8"

[stt.backend]
type = "python"
# НЕ указывайте executable - автопоиск .venv
script = "scripts/whisper_server.py"

[nlu]
mode = "Phonetic"
wake_words = ["Кларнет", "Ларнет", "Гларнет", "Кларнед", "ассистент", "компьютер", "Ассистент", "Компьютер"]
confidence_threshold = 0.7

[nlu.phonetic]
enabled = true
max_distance = 2
min_confidence = 0.6
auto_llm_on_question = true
auto_llm_on_long = true
auto_llm_on_no_match = true
auto_llm_on_low_confidence = true
patterns_path = "config/phonetic_patterns.yaml"

[nlu.llm]
provider = "openrouter"
model = "x-ai/grok-4-fast:free"
api_key = ""
api_key_env = "OPENROUTER_API_KEY"
max_tokens = 500
temperature = 0.3
top_p = 0.95
timeout_s = 5
retry_attempts = 3
cache_enabled = true
cache_ttl_s = 3600
max_concurrent_requests = 1
min_request_interval_ms = 0
system_prompt = """
Ты - голосовой помощник Кларнет. Исправляй ошибки распознавания речи и определяй намерение.

Частые ошибки:
- "Ларнет", "Гларнет", "Кларнед" → "Кларнет"
- "фключи" → "включи"
- "сфет" → "свет"

Игнорируй фоновый шум: "КРЯХТИТ", "*шум*", "эээ"

Отвечай ТОЛЬКО JSON:
{
  "intent": "название_интента",
  "entities": {},
  "confidence": 0.95,
  "corrected_text": "исправленный текст"
}
"""

[actions]
enabled_modules = ["system", "smart_home", "web"]
scripts_dir = "scripts/actions"

[actions.smart_home]
api_url = "http://homeassistant.local:8123"
api_token_env = "HASS_TOKEN"
timeout_s = 5

[actions.security]
allow_system_commands = true
require_confirmation = ["shutdown", "restart"]
blocked_commands = []

[tts]
enabled = true
engine = "silero"
language = "ru"
model = "v4_ru"
speaker = "xenia"
sample_rate = 48000
speed = 1.1

[tts.cache]
enabled = true
directory = "cache/tts"
max_entries = 256

[tts.monitoring]
enabled = true
min_rms = 0.01
max_latency_ms = 5000

[tts.runtime]
# НЕ указывайте python_path - автопоиск .venv
silero_script = "scripts/silero_tts.py"
piper_binary = "piper"
request_timeout_ms = 15000

[api]
enabled = true
host = "0.0.0.0"
port = 3000
cors_origins = ["*"]
grpc_enabled = true
grpc_port = 50051

[metrics]
enabled = true
prometheus_port = 9090
export_interval_s = 10

[observability]
metrics_enabled = true
traces_enabled = true
prometheus_port = 9090
export_interval_s = 10
service_name = "klarnet"
traces_endpoint = "http://localhost:4317"